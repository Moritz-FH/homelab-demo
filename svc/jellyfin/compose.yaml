networks:
  net_jellyfin:
    name: net_jellyfin
services:
  jellyfin:
    container_name: jellyfin
    environment:
      PGID: ${PGID:-1000}
      PUID: ${PUID:-1000}
      TZ: ${TZ:-Europe/Vienna}
    hostname: jellyfin
    image: docker.io/linuxserver/jellyfin:${JELLYFIN_VER:-latest}
    networks:
      net_jellyfin:
    ports:
      - ${JELLYFIN_HOST_IP:-0.0.0.0}:${JELLYFIN_HOST_PORT:-8096}:8096
    restart: unless-stopped
    volumes:
      - ${CONFIG_DIR:-../../.config}/jellyfin/config:/config
      - ${DATA_DIR:-../../data}/jellyfin/movies:/movies:ro
      - ${DATA_DIR:-../../data}/jellyfin/tvshows:/tvshows:ro
      - ${DATA_DIR:-../../data}/jellyfin/music:/music:ro
