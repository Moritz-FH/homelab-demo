networks:
  net_syncthing:
    name: net_syncthing
services:
  syncthing:
    container_name: syncthing
    environment:
      PGID: ${PGID:-1000}
      PUID: ${PUID:-1000}
      TZ: ${TZ:-Europe/Vienna}
    hostname: syncthing
    image: docker.io/linuxserver/syncthing:${SYNCTHING_VER:-latest}
    networks:
      net_syncthing:
    ports:
      - ${SYNCTHING_HOST_IP:-0.0.0.0}:${SYNCTHING_HOST_PORT:-8384}:8384
    restart: unless-stopped
    volumes:
      - ${CONFIG_DIR:-../../.config}/syncthing/config:/config
      - ${DATA_DIR:-../../data}:/data
